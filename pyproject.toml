[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-governance-model"
version = "0.2.0"
description = "Fail-closed workflow evidence and authority validation"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
